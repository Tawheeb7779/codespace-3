<style>
        /* Custom Animations & Effects for Aether Glass System */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap');

        body {
            background-color: #0b1326; /* bg-background */
            overflow-x: hidden;
        }

        .floating-orb {
            animation: float-orb 6s ease-in-out infinite;
            box-shadow: 0 0 60px rgba(77, 142, 255, 0.4), inset 0 0 30px rgba(173, 198, 255, 0.6);
        }

        @keyframes float-orb {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .wave-bar {
            width: 4px;
            border-radius: 9999px;
            background-color: #adc6ff; /* primary */
            animation: waveform 1.2s ease-in-out infinite;
            opacity: 0.8;
            box-shadow: 0 0 10px rgba(173, 198, 255, 0.5);
        }

        @keyframes waveform {
            0%, 100% { height: 16px; opacity: 0.4; }
            50% { height: 48px; opacity: 1; }
        }

        .glass-particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            border-radius: 20%;
            pointer-events: none;
            animation: float-up linear infinite;
        }

        @keyframes float-up {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Ambient Background Glow */
        .ambient-bg {
            background: radial-gradient(circle at 50% 30%, rgba(77, 142, 255, 0.15) 0%, transparent 60%);
        }
    </style>

<!-- Script for Atmospheric Particles -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('particle-container');
            const particleCount = 15;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('glass-particle');
                
                // Randomize size, position, and animation duration
                const size = Math.random() * 20 + 10; // 10px to 30px
                const left = Math.random() * 100; // 0% to 100%
                const duration = Math.random() * 10 + 10; // 10s to 20s
                const delay = Math.random() * 10; // 0s to 10s

                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${left}vw`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;

                container.appendChild(particle);
            }
        });
    </script>
