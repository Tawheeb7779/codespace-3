<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_2 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_2" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_2');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
camera.position.set(5, 3, 5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x3B82F6, 2, 50);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// Abstract Workspace Stations
function createStation(pos, color, label) {
    const group = new THREE.Group();
    
    // Base platform
    const geo = new THREE.BoxGeometry(2, 0.1, 2);
    const mat = new THREE.MeshPhongMaterial({ 
        color: 0x111827, 
        transparent: true, 
        opacity: 0.8,
        shininess: 100
    });
    const base = new THREE.Mesh(geo, mat);
    group.add(base);
    
    // Floating "Screen" / Data panel
    const screenGeo = new THREE.PlaneGeometry(1.5, 1);
    const screenMat = new THREE.MeshBasicMaterial({ 
        color: color, 
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.3
    });
    const screen = new THREE.Mesh(screenGeo, screenMat);
    screen.position.y = 0.8;
    screen.rotation.y = Math.PI / 4;
    group.add(screen);

    // Frame
    const edges = new THREE.EdgesGeometry(screenGeo);
    const lineMat = new THREE.LineBasicMaterial({ color: color });
    const wireframe = new THREE.LineSegments(edges, lineMat);
    wireframe.position.copy(screen.position);
    wireframe.rotation.copy(screen.rotation);
    group.add(wireframe);

    group.position.copy(pos);
    scene.add(group);
    return group;
}

const stations = [
    { pos: new THREE.Vector3(0, 0, 0), color: 0x3B82F6, label: 'Core' },
    { pos: new THREE.Vector3(-3, 0, -2), color: 0x60A5FA, label: 'Files' },
    { pos: new THREE.Vector3(3, 0, -2), color: 0x60A5FA, label: 'Terminal' },
    { pos: new THREE.Vector3(0, 1.5, -4), color: 0x10B981, label: 'Preview' }
];

const stationMeshes = stations.map(s => createStation(s.pos, s.color, s.label));

// Background Grid
const gridHelper = new THREE.GridHelper(20, 20, 0x3B82F6, 0x111827);
gridHelper.position.y = -0.1;
scene.add(gridHelper);

// Animation loop
function animate(time) {
    requestAnimationFrame(animate);
    
    const t = time * 0.001;
    
    stationMeshes.forEach((station, i) => {
        station.position.y = Math.sin(t + i) * 0.1;
        station.children[1].rotation.y += 0.01;
        station.children[2].rotation.y += 0.01;
    });

    camera.position.x = 5 * Math.cos(t * 0.1);
    camera.position.z = 5 * Math.sin(t * 0.1);
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
}

animate(0);

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_2 -->
</body>
</html>
