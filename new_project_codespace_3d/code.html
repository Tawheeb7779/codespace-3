<!-- Script for interactive template selection styling -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('templateGrid');
            const buttons = grid.querySelectorAll('button');
            const indicator = document.getElementById('templateIndicator');

            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Remove active styles from all
                    buttons.forEach(b => {
                        b.classList.remove('glow-active');
                        const icon = b.querySelector('.material-symbols-outlined');
                        const text = b.querySelector('span:last-child');
                        
                        icon.classList.remove('text-primary');
                        icon.classList.add('text-outline');
                        
                        text.classList.remove('text-primary', 'font-semibold');
                        text.classList.add('text-on-surface-variant');
                        
                        b.classList.add('hover:border-outline-variant/50', 'hover:bg-surface-container-high');
                    });

                    // Add active styles to clicked
                    btn.classList.add('glow-active');
                    btn.classList.remove('hover:border-outline-variant/50', 'hover:bg-surface-container-high');
                    
                    const activeIcon = btn.querySelector('.material-symbols-outlined');
                    const activeText = btn.querySelector('span:last-child');
                    
                    activeIcon.classList.remove('text-outline');
                    activeIcon.classList.add('text-primary');
                    
                    activeText.classList.remove('text-on-surface-variant');
                    activeText.classList.add('text-primary', 'font-semibold');

                    // Update indicator
                    indicator.textContent = activeText.textContent;
                });
            });
        });
    </script>
